<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站列表</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 登录/注册页面容器 -->
<div class="auth-container" id="authContainer">
    <!-- 登录表单 -->
    <div id="loginForm" class="auth-box" style="display: block;">
        <h2>欢迎回来</h2>
        <p class="auth-subtitle">请登录您的账户</p>
        <label for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码">
        <div class="auth-btn-group">
            <button class="btn-primary" onclick="login()">登 录</button>
            <button class="btn-secondary" onclick="showRegisterForm()">注 册</button>
        </div>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" class="auth-box" style="display: none;">
        <h2>创建账户</h2>
        <p class="auth-subtitle">填写以下信息完成注册</p>
        <label for="regUsername">用户名</label>
        <input type="text" id="regUsername" placeholder="请输入用户名">
        <label for="regPassword">密码</label>
        <input type="password" id="regPassword" placeholder="请输入密码">
        <label for="regConfirmPassword">确认密码</label>
        <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
        <div class="auth-btn-group">
            <button class="btn-primary" onclick="register()">注 册</button>
            <button class="btn-secondary" onclick="showLoginForm()">返回登录</button>
        </div>
    </div>
</div>

<!-- 主内容区域（需登录后显示） -->
<div id="mainContent" style="display: none;">
    <!-- 用户信息栏 -->
    <div class="user-bar">
        <div class="user-info">
            <span class="user-icon">&#128100;</span>
            <span id="currentUserDisplay"></span>
        </div>
        <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>

    <div class="search-bar">
        <div class="search-item">
            <label for="nameSearch">网站名称</label>
            <input type="text" id="nameSearch" placeholder="输入网站名称">
        </div>
        <div class="search-item">
            <label for="countrySearch">国家</label>
            <input type="text" id="countrySearch" placeholder="输入国家">
        </div>
        <div class="search-item">
            <label for="alexaSearch">Alexa 排名</label>
            <input type="number" id="alexaSearch" placeholder="输入排名">
        </div>
        <div class="search-actions">
            <button class="btn-search" onclick="searchWebsites()">查询</button>
            <button class="btn-clear" onclick="clearAllInputs()">清空</button>
        </div>
    </div>

    <div class="action-bar">
        <button id="addButton" class="btn-add">+ 新增网站</button>
        <button onclick="exportWebsites()" class="btn-export">导出数据</button>
    </div>

    <!-- 新增表单 -->
    <form id="websiteForm" class="floating-form" style="display: none;">
        <span class="close-btn" onclick="closeAddForm()">&times;</span>
        <label for="name">网站名称:</label>
        <input type="text" style="margin-top: 13px;" id="name" name="name" required><br>
        <label for="url">网站URL:</label>
        <input type="text" id="url" name="url" required><br>
        <label for="alexa">Alexa排名:</label>
        <input type="number" id="alexa" name="alexa" required><br>
        <label for="country">国家:</label>
        <input type="text" id="country" name="country" required><br>
        <button type="submit">提交</button>
    </form>

    <div id="result"></div>

    <!-- 编辑表单 -->
    <form id="editForm" class="floating-form" style="display: none;">
        <span class="close-btn" onclick="closeEditForm()">&times;</span>
        <input type="hidden" id="editId">
        <label for="editName">网站名称:</label>
        <input type="text" style="margin-top: 13px;" id="editName" name="editName" required><br>
        <label for="editUrl">网站URL:</label>
        <input type="text" id="editUrl" name="editUrl" required><br>
        <label for="editAlexa">Alexa排名:</label>
        <input type="number" id="editAlexa" name="editAlexa" required><br>
        <label for="editCountry">国家:</label>
        <input type="text" id="editCountry" name="editCountry" required><br>
        <button type="submit">保存修改</button>
    </form>

    <div id="app">
        <table>
            <thead>
            <tr>
                <th>网站名称</th>
                <th>网站URL</th>
                <th>Alexa 排名</th>
                <th>所在国家</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="websiteTableBody"></tbody>
        </table>
    </div>

    <div id="pagination" style="text-align: center;margin-top: 15px;">
        <button onclick="prevPage()">上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button onclick="nextPage()">下一页</button>
    </div>
</div>

<script src="script.js"></script>
<script>
    // 切换到注册表单
    function showRegisterForm() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }

    // 切换到登录表单
    function showLoginForm() {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
    }

    // 登录
    function login() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            alert('请输入用户名和密码');
            return;
        }

        fetch('http://localhost:8080/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.statusCode === 200) {
                    // 存储Token和用户信息
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    // 隐藏登录容器，显示主内容区
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('currentUserDisplay').innerText = '当前用户: ' + data.username;
                    // 加载网站列表
                    getWebsiteList();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('登录出错:', error);
                alert('登录时发生错误，请稍后重试');
            });
    }

    // 注册
    function register() {
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (!username || !password) {
            alert('请输入用户名和密码');
            return;
        }
        if (password !== confirmPassword) {
            alert('两次输入的密码不一致');
            return;
        }

        fetch('http://localhost:8080/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.statusCode === 200) {
                    alert('注册成功，请登录');
                    showLoginForm();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('注册出错:', error);
                alert('注册时发生错误，请稍后重试');
            });
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('authContainer').style.display = 'flex';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('currentUserDisplay').innerText = '';
        // 清空输入框
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
    }

    // 页面加载时检查是否已登录
    window.addEventListener('load', function() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (token && username) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('currentUserDisplay').innerText = '当前用户: ' + username;
            getWebsiteList();
        }
    });
</script>
</body>
</html>
